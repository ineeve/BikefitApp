name: Setup Dependencies (Pre-firewall)

# This workflow runs as a setup step BEFORE the Copilot agent's firewall is enabled
# It pre-caches Gradle dependencies so the agent can build without network access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gradle/libs.versions.toml'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'

jobs:
  cache-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Download all dependencies
        run: |
          ./gradlew dependencies --write-locks || true
          ./gradlew :app:dependencies --configuration debugCompileClasspath || true
          ./gradlew assembleDebug --dry-run || true
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      
      - name: Cache Gradle packages
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
